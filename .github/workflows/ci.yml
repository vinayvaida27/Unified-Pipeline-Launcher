name: CI

on:
  push:
    branches: [main, hri]
  pull_request:
    branches: [main]

jobs:
  windows-tests:
    name: Windows Python ${{ matrix.python-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.14"
          enable-cache: true

      - name: Verify dependency lock
        run: uv lock --project src --check

      - name: Synchronize development dependencies
        run: uv sync --project src --locked --python ${{ matrix.python-version }}

      - name: Run tests
        run: uv run --project src --locked --python ${{ matrix.python-version }} pytest src/tests

      - name: Run public quality gate
        shell: pwsh
        run: .\src\scripts\public_quality_gate.ps1 -SkipPytest
