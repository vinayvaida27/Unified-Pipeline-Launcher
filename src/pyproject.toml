[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-pipeline-launcher"
version = "1.0.0"
description = "Windows desktop launcher and process manager for data applications"
requires-python = ">=3.11,<3.13"
dependencies = [
  "PySide6>=6.7,<7",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "streamlit>=1.40,<2",
  "pyinstaller>=6",
]

[tool.uv]
required-version = "==0.11.14"

[tool.setuptools.packages.find]
include = ["launcher*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: exercises real subprocesses and local sockets",
  "e2e: drives a real browser against a launched application",
  "performance: runs opt-in timing and resource measurements",
]
